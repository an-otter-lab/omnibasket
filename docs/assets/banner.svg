<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Omnibasket: one basket, every shop, lowest total. Sample basket of 7 books: one order 558.73 lei, cheapest split 515.16 lei, delivery included.">
  <rect width="1280" height="400" rx="20" fill="#14532d"/>

  <text x="56" y="76" font-size="30" font-weight="700" fill="#ffffff">omnibasket</text>
  <text x="56" y="170" font-size="54" font-weight="800" fill="#ffffff">One basket, every shop,</text>
  <text x="56" y="232" font-size="54" font-weight="800" fill="#7fd39f">lowest total.</text>
  <text x="56" y="286" font-size="23" fill="#dcebe1">Splits a basket of books across online bookshops</text>
  <text x="56" y="318" font-size="23" fill="#dcebe1">for the lowest real total, delivery included.</text>

  <!-- One order -->
  <rect x="724" y="56" width="500" height="112" rx="16" fill="#0b3a1f"/>
  <text x="752" y="100" font-size="22" font-weight="700" fill="#dcebe1">1 order</text>
  <text x="752" y="136" font-size="19" fill="#a6cdb4">Libris · 7 books</text>
  <text x="1196" y="124" font-size="36" font-weight="700" fill="#dcebe1" text-anchor="end">558.73 lei</text>

  <!-- Cheapest -->
  <rect x="724" y="184" width="500" height="132" rx="16" fill="#f4efe6"/>
  <text x="752" y="228" font-size="22" font-weight="700" fill="#14532d">Cheapest</text>
  <text x="752" y="264" font-size="19" fill="#404040">Amazon.de · 4 books</text>
  <text x="752" y="292" font-size="19" fill="#404040">Libris · 3 books</text>
  <text x="1196" y="244" font-size="42" font-weight="800" fill="#14532d" text-anchor="end">515.16 lei</text>
  <text x="1196" y="284" font-size="20" font-weight="700" fill="#14532d" text-anchor="end">43.57 lei less</text>

  <text x="1224" y="356" font-size="16" fill="#a6cdb4" text-anchor="end">Sample basket, prices read 27–28 Oct 2026</text>
</svg>
