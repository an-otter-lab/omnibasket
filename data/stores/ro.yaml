# Romanian store rules the v1 basket lock is allowed to use.
# Amounts are integer cents of `currency`. null means the measured page
# did not publish a single figure solver.types.Store can take.
# Do not fill a null from a formula, a guess, or another day's note.
checked_at: 2026-10-28
stores:
  - id: libris
    currency: RON
    free_shipping_threshold_cents: 13500
    shipping_fee_cents: 1290
    per_order_fee_cents: 0
    membership: null
    source_url: https://www.libris.ro/informatiiUtile/beneficii
    read_date: 2026-10-28
    capture: spike/out/libris-shipping/text.txt
    notes: >-
      Courier in Romania is free above 135 lei, otherwise 12.90 lei.
      Easybox uses the same fee. No membership price on this page.

  - id: bookzone
    currency: RON
    free_shipping_threshold_cents: 20000
    shipping_fee_cents: 690
    per_order_fee_cents: 199
    membership: null
    source_url: https://bookzone.ro/cos/produse
    read_date: 2026-10-28
    capture: spike/out/bookzone-cart-real/text.txt
    notes: >-
      One book under 200 lei (Ghici, 46.50) was added to the cart.
      The cart page, not checkout, prints "Cost livrare: De la 6.9 Lei"
      and "Cost procesare: 1.99 Lei". The same page's subtotal is
      55.39 lei, which is 46.50 + 6.90 + 1.99, so this order was
      charged 6.90 lei for delivery. The words "De la" mean 6.90 is
      the floor shown for this cart, not a promise that every heavier
      order stays at 6.90. Free transport from 200 lei is on the same
      header ("Mai adaugă 153.50 lei și ai transport GRATUIT").
      Stopped on /cos/produse. No address and no payment.

  - id: amazon_de
    currency: RON
    free_shipping_threshold_cents: 26217
    free_shipping_threshold_eur_cents: 4900
    shipping_fee_cents: null
    per_order_fee_cents: 0
    membership: null
    source_url: https://www.amazon.de/gp/help/customer/display.html?nodeId=GA6MMBQJBJ5QYUDW
    read_date: 2026-10-28
    capture: spike/out/shipping-rates/text.txt
    notes: >-
      Books to Romania are free from 49.00 EUR. Buy boxes print that bar
      as 262.17 RON. Under the bar the charge is 4.99 EUR per delivery
      plus 1.99 EUR per kg. None of the four priced product pages states
      a weight (no Gewicht line in spike/out/gruffalo, room-broom,
      charlottes-web, hp-stone text.txt on the amazonde worktree).
      shipping_fee_cents stays null. The four Amazon.de item prices sum
      to 188.76 lei, 73.41 lei under 262.17, so the free-shipping branch
      is not reached either.

  - id: emag
    currency: RON
