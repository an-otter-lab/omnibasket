# Romanian store rules the v1 basket lock is allowed to use.
# Amounts are integer cents of `currency`. The Amazon.de under-bar
# shipping_fee_cents is the published 4.99 EUR delivery component
# converted at the rate printed on the buy boxes (49.00 EUR = 262.17 RON).
# It is a floor. The 1.99 EUR/kg term is not included: no captured
# product page states a weight.
checked_at: 2026-10-28
stores:
  - id: libris
    currency: RON
    free_shipping_threshold_cents: 13500
    shipping_fee_cents: 1290
    per_order_fee_cents: 0
    membership: null
    source_url: https://www.libris.ro/informatiiUtile/beneficii
    read_date: 2026-10-28
    capture: spike/out/libris-shipping/text.txt
    notes: >-
      Courier in Romania is free above 135 lei, otherwise 12.90 lei.
      Easybox uses the same fee. No membership price on this page.

  - id: bookzone
    currency: RON
    free_shipping_threshold_cents: 20000
    shipping_fee_cents: 690
    per_order_fee_cents: 199
    membership: null
    source_url: https://bookzone.ro/cos/produse
    read_date: 2026-10-28
    capture: spike/out/bookzone-cart-real/text.txt
    notes: >-
      One book under 200 lei (Ghici, 46.50) was added to the cart.
      The cart page prints "Cost livrare: De la 6.9 Lei" and
      "Cost procesare: 1.99 Lei". The subtotal 55.39 is
      46.50 + 6.90 + 1.99. "De la" means 6.90 is the floor this cart
      showed. Free transport from 200 lei is on the same header.
      Stopped on /cos/produse. No address and no payment.

  - id: amazon_de
    currency: RON
    free_shipping_threshold_cents: 26217
    free_shipping_threshold_eur_cents: 4900
    shipping_fee_cents: 2670
    shipping_fee_is_floor: true
    per_kg_fee_cents: null
    per_order_fee_cents: 0
    membership: null
    source_url: https://www.amazon.de/gp/help/customer/display.html?nodeId=GA6MMBQJBJ5QYUDW
    read_date: 2026-10-28
    capture: spike/out/shipping-rates/text.txt
    fx_capture: spike/out/amz-isbn/9781529105100/text.txt
    notes: >-
      Romania, books, standard delivery: 4.99 EUR per delivery plus
      1.99 EUR per kg, free from 49.00 EUR. Buy boxes print that bar
      as 262.17 RON, so 1 EUR = 262.17/49 RON on the same page.
      4.99 EUR converts to 26.698 lei, recorded as 2670 cents.
      None of the four product pages states a weight, so the per-kg
      term is not added. 2670 is a floor, not the full under-bar
      charge. A higher true fee cannot change an assignment that
      already sits over the bar (its shipping is zero) and can only
      make an under-bar Amazon order worse.

  - id: emag
    currency: RON
    free_shipping_threshold_cents: null
    shipping_fee_cents: null
    per_order_fee_cents: null
    per_order_fee_percent: 1
    per_order_fee_min_cents: 149
    per_order_fee_max_cents: 399
    membership: null
    source_url: https://www.emag.ro/help/livrarea-comenzilor-emag-2/
    read_date: 2026-10-28
    capture: spike/out/headful/emag-delivery/text.txt
    notes: >-
      1% operational fee, minimum 1.49 lei, maximum 3.99 lei.
      The solver Store type has one flat per-order fee. The lock
      passes 1.49 lei, which is exact when the eMAG lines in an
      assignment are at most 149 lei. No captured title in this
      basket is sold by eMAG, and none shows a Genius badge.
