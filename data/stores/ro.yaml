      Cart step, logged out, deliver-to Romania: one book,
      Where the Wild Things Are (dp/0064431789), 38.42 RON,
      under the free-shipping bar. The cart prints
      "Füge qualifizierte Produkte im Wert von mind. 223,77 RON hinzu,
      um dich für GRATIS Standardversand zu qualifizieren"
      and "GRATIS-Versand für Bestellungen ab 262,19 RON".
      38.42 + 223.77 = 262.19. It does not print a per-delivery
      amount or a per-kg amount. The Details control on that line
      stays on the same cart page and still shows no fee.
      "Zur Kasse gehen" redirects to Amazon sign-in and was not
      completed. No account, no address form, no payment.
      per-delivery and per-kg stay unknown. The step that would
      confirm them is the shipping summary after sign-in, before
      any payment field.

