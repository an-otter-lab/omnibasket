  - id: barnesandnoble
    name: Barnes & Noble
    domain: barnesandnoble.com
    region: US
    currency: USD
    free_shipping_threshold: 60
    free_shipping_threshold_note: >-
      Non-member free standard shipping at $60 before tax, US only. Premium and
      Legacy Members: free shipping at $15. The product page has no delivery-ZIP
      field. The store finder was given 10001 before product pages were read.
      Prices on the product pages were already USD, with no import line.
    shipping_fee_below_threshold: 6.99
    shipping_fee_below_threshold_note: >-
      "Standard Shipping pricing for non-members with an order below $60 is $6.99."
    per_order_fee: null
    per_order_fee_note: The published under-threshold charge is the $6.99 standard shipping fee, not a separate per-order fee.
    membership:
      name: Premium Membership
      price: 39.99
      period: year
      benefits:
        - Free shipping online with $15 or more of eligible items
        - 1 stamp for every $10 spent; 10 stamps = $5 reward
        - A tote every Premium Membership year
    search_url_pattern: "https://www.barnesandnoble.com/s/{query}"
    readable: true
    source_urls:
      - https://www.barnesandnoble.com/pages/membership
      - https://help.barnesandnoble.com/hc/en-us/articles/5335188103323-Free-Shipping-Requirements
      - https://help.barnesandnoble.com/hc/en-us/articles/5334520517531-Shipping-Speeds-and-Fees
    checked_at: 2026-10-27
