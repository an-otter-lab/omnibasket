# US store registry. Values read 2026-10-27 from each store's own page, headful,
# logged out. Session ZIP 10001 was set before help pages were read, except where noted.
# null means the store did not publish the figure on a page we could read.
checked_at: 2026-10-27
delivery_zip: "10001"
stores:
  - id: amazon
    name: Amazon
    domain: amazon.com
    region: US
    currency: USD
    free_shipping_threshold: null
    free_shipping_threshold_note: >-
      The free-shipping help page says orders need "at least the stated minimum
      threshold" and does not print a dollar amount. After ZIP 10001, the
      product pages (not the help page) say "FREE delivery ... on orders shipped
      by Amazon over $35".
    shipping_fee_below_threshold: null
    shipping_fee_below_threshold_note: >-
      The shipping help page says a fee may apply when an order does not qualify.
      It does not publish a flat dollar fee.
    per_order_fee: null
    per_order_fee_note: No flat per-order fee is printed on the shipping help page.
    membership:
      name: Prime
      price: 14.99
      period: month
      price_note: >-
        Prime Monthly is $14.99 per month after a 30-day trial. Prime Annual is
        $139 per year after trial. Also listed: Prime for Young Adults $7.49/month,
        Prime Access $6.99/month.
      benefits:
        - Free Prime delivery on eligible items with no minimum (benefits help, Deliver to New York 10001)
        - Free Same-Day Delivery when the purchase totals $25 or more in most U.S. areas
        - Prime Video, Amazon Music with Prime, and other shopping benefits named on the benefits page
    search_url_pattern: "https://www.amazon.com/s?k={query}"
    readable: true
    source_urls:
      - https://www.amazon.com/amazonprime
      - https://www.amazon.com/gp/help/customer/display.html?nodeId=G6LDPN7YJHYKH2J6
      - https://www.amazon.com/gp/help/customer/display.html?nodeId=GZXW7X6AKTHNUP6H
    checked_at: 2026-10-27

  - id: target
    name: Target
    domain: target.com
    region: US
    currency: USD
    free_shipping_threshold: 35
    free_shipping_threshold_note: >-
      Shipping and order services page, header "Ship to 10001": "Free shipping as
      soon as tomorrow on hundreds of thousands of items on orders above $35."
      Same page says no minimum on eligible items for members or when paying with
      a Target Circle Card. A flat fee under $35 is not printed.
    shipping_fee_below_threshold: null
    shipping_fee_below_threshold_note: >-
      Not published as a flat parcel fee. Same-day delivery is a different service,
      priced on that page as "pay $9.99 for same-day delivery" or a 14-day trial.
    per_order_fee: null
    per_order_fee_note: No flat per-order fee on the shipping page.
    membership:
      name: Target Circle 360
      price: 10.99
      period: month
      price_note: >-
        Regular price on https://www.target.com/circlecard (read 2026-10-27):
        "$49/year (reg $99) or $4.99/month (reg $10.99)" for Target Circle Card
        holders, so the regular rate is $10.99/month or $99/year. The "How much
        does it cost" help question could not be opened: a press-and-hold iframe
        covered it and was not solved.
      benefits:
        - Unlimited same-day delivery on orders over $35
        - Monthly freebies
        - Free 2-day shipping on hundreds of thousands of items
        - No-rush returns with an extra 30 days
    search_url_pattern: "https://www.target.com/s?searchTerm={query}"
    readable: false
    readable_note: >-
      Help and the homepage loaded after ZIP 10001. Product pages this pass were
      covered by Target's "Press & hold" quick verification. That control was not
      used, so product price, seller, and ships-from were not read.
    source_urls:
      - https://www.target.com/c/shipping-order-services/-/N-551st
      - https://www.target.com/help/article/000163168
      - https://www.target.com/circlecard
      - https://www.target.com/help/articles/target-circle/about-target-circle-360
    checked_at: 2026-10-27

