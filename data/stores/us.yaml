    shipping_fee_below_threshold: null
    shipping_fee_below_threshold_note: Not published on a page we could read. Press-and-hold wall.
    per_order_fee: null
    per_order_fee_note: Not published on a page we could read. Press-and-hold wall.
    membership:
      name: Walmart+
      price: null
      period: null
      price_note: >-
        The homepage names Walmart+ but the membership price and shipping
        threshold were not on a help page we could read. A homepage promo said
        "Get Walmart+ with Sam's Club Plus for just $120/year"; that is a bundle
        line, not the Walmart+ price, and it was not used.
      benefits: []
    search_url_pattern: "https://www.walmart.com/search?q={query}"
    readable: false
    source_urls:
      - https://www.walmart.com/
      - https://www.walmart.com/plus
