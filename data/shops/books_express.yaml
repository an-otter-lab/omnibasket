id: books_express
name: Books-Express
domain: www.books-express.ro
status: checked
currency: RON
# Books-Express sells its own stock only: no third-party marketplace sellers.
# A live offer whose page does not name a seller is direct (policy A, 30 Oct).
seller_model: direct_only
robots:
  source_url: https://www.books-express.ro/robots.txt
  read_date: 2026-10-30
  allowed_paths: ["/"]
  disallowed_paths: ["/user/", "/gr/", "/check-images"]
  sitemaps: ["https://www.books-express.ro/sitemap_index.xml.gz"]
product_pages:
  strategy: schema.org-first
  schemas: [Product, Book]
shipping_rules:
  - kind: free_threshold
    amount: 400.00
    currency: RON
    source_url: https://www.books-express.ro/p/intrebari-frecvente
    read_date: 2026-10-30
  - kind: below_threshold_fee
    amount: 19.99
    currency: RON
    source_url: https://www.books-express.ro/p/intrebari-frecvente
    read_date: 2026-10-30
