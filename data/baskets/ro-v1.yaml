# Omnibasket v1 candidate, measured 2026-10-28, point-3 reshape.
# Every price_cents value is copied from a saved page, not computed.
# null is not used for a price. The Amazon.de under-bar fee is not an
# item price; it is recorded on the store, not here.
# spike/out is gitignored. Paths are relative to this worktree.
# listing_url is the product page read (capture meta.json final_url, or
# spike/products-ro-v1.json for the amz-isbn and candidates captures).
# edition is paperback|board_book|hardcover|other as the page printed it;
# null when the page printed no format. read_at is the capture date.
checked_at: 2026-10-28
currency: RON
direction: >-
  Keep Ghici, The Very Hungry Caterpillar and Owl Babies. Replace the
  four cheap Amazon.de paperbacks (188.76 lei) with four Amazon.de-dispatched
  editions whose Amazon prices sum to 345.05 lei, over the 262.17 lei bar.
  Each replacement is the same ISBN at Libris.
solved_store_ids: [libris, emag, bookzone, amazon_de]
books:
  - id: ghici
    title: Ghici cât de mult te iubesc
    role: kept-romanian
    isbn13: "9786068996011"
    isbn_note: Bookzone specs and the eMAG URL. The Libris page does not print an ISBN.
    offers:
      - store_id: bookzone
        price_cents: 4650
        seller_certainty: direct
        seller: Bookzone
        capture: spike/out/bookzone-ghici/text.txt
        listing_url: https://bookzone.ro/carte/ghici-cat-de-mult-te-iubesc
        edition: board_book
        read_at: 2026-10-27
        evidence: "Visible price 46.5 Lei. Cart subtotal uses this price."
      - store_id: emag
        price_cents: 5600
        seller_certainty: marketplace
        seller: CARTEA COPIILOR
        genius_badge: false
        sold_by_emag: false
        capture: spike/out/headful/emag-ghici/text.txt
        listing_url: https://www.emag.ro/ghici-cat-de-mult-carte-cartonata-integral-sam-mcbratney-cco978-606-8996-01-1/pd/DGJW95BBM/
        edition: board_book
        read_at: 2026-10-27
        evidence: "56,00 Lei. Vândut și livrat de: CARTEA COPIILOR. No product Genius badge."
      - store_id: libris
        price_cents: 5700
        seller_certainty: direct
        seller: Libris
        capture: spike/out/libris-ghici/text.txt
        listing_url: https://www.libris.ro/carte/ghici-cat-de-mult-te-iubesc-sam-mcbratney/21197307
