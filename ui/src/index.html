<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Omnibasket</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Feature 8: theme and language before first paint (ThemeService / I18nService take over). -->
  <script>try{var d=document.documentElement,t=localStorage.getItem('omnibasket.theme.v1'),l=localStorage.getItem('omnibasket.lang.v1');d.setAttribute('data-theme',t==='light'||t==='dark'?t:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));d.lang=l==='ro'||l==='en'?l:(/^ro/i.test(navigator.language||'')?'ro':'en')}catch(e){}</script>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Omnibasket">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="application-name" content="Omnibasket">
  <meta name="theme-color" content="#14532d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
